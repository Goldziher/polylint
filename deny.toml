
[licenses]
version = 2
# Workspace crates are never published; the alef-generated component producer crates carry no
# license field.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "PSF-2.0",
]

# jarl-core's workspace Cargo.toml sets `license-file = "LICENSE.md"` but the
# actual file at the repo root is named `LICENSE` (no .md extension).
[[licenses.clarify]]
name = "jarl-core"
expression = "MIT"

[[licenses.clarify.license-files]]
path = "../../LICENSE"
hash = 0x3B9B906C

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2
ignore = [
  # `paste` is unmaintained (RUSTSEC-2024-0436): a maintenance notice, not a vulnerability, on a transitive dependency.
  "RUSTSEC-2024-0436",
  # `serde_yaml` (-> `unsafe-libyaml`) is a dependency of rumdl and sqruff-lib-dialects.
  "RUSTSEC-2024-0449",
  # `proc-macro-error2` is unmaintained (RUSTSEC-2026-0173): a build-time proc-macro dependency of `merge_derive`,
  # reached through `tex-fmt` (LaTeX formatting); a maintenance notice, not a vulnerability.
  "RUSTSEC-2026-0173",
  # `atty` (RUSTSEC-2024-0375) and `proc-macro-error` (RUSTSEC-2024-0370) are unmaintained, reached through `clap` 3,
  # which the `stylua` crate declares as a non-optional dependency of its CLI; poly links only its library half.
  # Maintenance notices, not vulnerabilities.
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0375",
  # harper-core 3.2.0 (the opt-in `prose` component) requires `zip` ^8.6, and the fixes are only in 9.x. The four zip
  # advisories cover `ZipArchive::extract` writing an archive to disk; harper reads zip only in memory, to load
  # weirpack rule bundles (`ZipArchive::new` over a byte cursor), and poly never calls that API. Revisit when harper
  # moves to zip 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
  # Four more zip advisories fixed only in 9.x, same dependency and same reasoning: AES entry authentication (0545),
  # `ZipArchive::extract` symlink targets (0546), preallocation in the legacy Shrink/Reduce/Implode decoders (0547)
  # and `ZipStreamReader` entry names (0548). They need an attacker-supplied archive; the only zip reader is
  # harper's weirpack loader, which poly never calls.
  "RUSTSEC-2026-0545",
  "RUSTSEC-2026-0546",
  "RUSTSEC-2026-0547",
  "RUSTSEC-2026-0548",
  # `chrono` is unmaintained (RUSTSEC-2026-0543), reached through `quick-junit` (ruff), `schemars` and `rmcp`; a
  # maintenance notice with no fixed release, not a vulnerability.
  "RUSTSEC-2026-0543",
  # `bincode` is unmaintained (RUSTSEC-2025-0141), reached through harper's `burn` model runtime; a maintenance notice
  # with no successor release, not a vulnerability.
  "RUSTSEC-2025-0141",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
