# The secret-scanning engine family, in a cargo workspace of its own. kingfisher's rule engine links vectorscan, a C++
# library fetched as a checksum-verified prebuilt archive (or built with cmake and Boost) by the `-sys` crate's build
# script. Keeping it here keeps that native build, its network fetch and kingfisher's heavy dependency tree (gix, tokei,
# aws-lc) out of the root and `components/` lockfiles. alef builds the component from here (`source_manifest` /
# `producer_dir` in the root alef.toml).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.36.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
repository = "https://github.com/polylint/polylint"
documentation = "https://github.com/polylint/polylint"

[workspace.dependencies]
anyhow = "1"
# Exact pins: the findings are the product, and the rule catalog (kingfisher-rules) changes what is detected between
# minor releases. A bump is a deliberate change that moves `SecretsEngine::version()` with it; the engine's
# `tests/version_audit.rs` fails when the two disagree. `validation` stays off, so nothing here can reach the network.
kingfisher-rules = "=3.2.0"
kingfisher-scanner = { version = "=3.0.3", default-features = false }
kingfisher-vectorscan-sys = "=0.1.4"
poly-component-host = { path = "../crates/poly-component-host" }
poly-component-index = { path = "../crates/poly-component-index" }
poly-component-protocol = { path = "../crates/poly-component-protocol" }
poly-config = { path = "../crates/poly-config" }
poly-core = { path = "../crates/poly-core", default-features = false }
poly-engine-api = { path = "../crates/poly-engine-api" }
poly-engines = { path = "../crates/poly-engines", default-features = false }
poly-engines-secrets = { path = "crates/poly-engines-secrets" }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
