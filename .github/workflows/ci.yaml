name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  toolchain:
    name: toolchain baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # components/ is excluded from the root workspace, so `--all` above never reaches it.
      - run: cargo fmt --manifest-path components/Cargo.toml --all --check
      - run: cargo fmt --manifest-path components-pyrefly/Cargo.toml --all --check
      - run: cargo fmt --manifest-path components-secrets/Cargo.toml --all --check
      - run: cargo fmt --manifest-path components-tsrs/Cargo.toml --all --check

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            components
            components-pyrefly
            components-secrets
            components-tsrs
      - run: cargo clippy --workspace --exclude conformance --all-targets -- -D warnings
      - uses: xberg-io/actions/setup-mise@v1
      - name: clippy (components workspace)
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check clippy
      - name: clippy (pyrefly workspace)
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check clippy pyrefly
      - name: clippy (secrets workspace)
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check clippy secrets
      - name: clippy (tsrs workspace)
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check clippy tsrs
      # Linux only: rustdoc output does not vary by host, and the hook runs the same task.
      - name: rustdoc lint (components workspace)
        if: runner.os == 'Linux'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check rustdoc
      - name: rustdoc lint (pyrefly workspace)
        if: runner.os == 'Linux'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check rustdoc pyrefly
      - name: rustdoc lint (secrets workspace)
        if: runner.os == 'Linux'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check rustdoc secrets
      - name: rustdoc lint (tsrs workspace)
        if: runner.os == 'Linux'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check rustdoc tsrs

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Integration binaries link the full engine registry; line tables exhaust the Linux runner disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            components
            components-pyrefly
        # --no-fail-fast is not optional: cargo stops at the first failing test
        # binary, so a run with failures in three crates reports only the first
        # and the rest are rediscovered one CI round at a time.
      - name: Setup managed Python for native CMD regressions
        if: runner.os == 'Windows'
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: python
      - name: Select native Python and require eight CMD regression tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          printf 'POLY_TEST_PYTHON=%s\n' "$(mise which python)" >> "$GITHUB_ENV"
          cargo test -p poly-hooks windows_cmd_transport -- --list > cmd-transport-tests.txt
          count="$(awk '
            /^runner::exec::shell::windows_tests::windows_cmd_transport_.*: test$/ {n++}
            END {print n+0}
          ' cmd-transport-tests.txt)"
          echo "Native CMD regression tests collected: $count/8"
          test "$count" -eq 8
      - run: cargo test --workspace --exclude conformance --no-fail-fast
      - name: test (components workspace)
        run: cargo test --locked --manifest-path components/Cargo.toml --workspace --no-fail-fast
      - name: test (pyrefly workspace)
        run: cargo test --locked --manifest-path components-pyrefly/Cargo.toml --workspace --no-fail-fast

  dogfood:
    # poly is a linter, and the repository is a real polyglot tree — Rust, TOML,
    # Markdown, YAML, JSON, shell. Running the binary against its own repo is the
    # only job here that exercises discovery, the engine registry and the report
    # path end to end on real files; the unit suite drives them on fixtures.
    #
    # Windows is in the matrix deliberately: path handling, line endings and the
    # ignore walk are where a cross-platform linter actually breaks, and none of
    # that is reachable from a test that never touches a real tree.
    name: dogfood / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components
      # The core binary cannot lint TOML, Markdown, JSON, YAML, JS/TS or CSS without the downloadable
      # component, so dogfooding runs the bundled binary built from components/.
      # --workspace never skips the whole-project phase: `cargo clippy` over this
      # repo is already its own job above, and running it twice buys nothing.
      - name: poly lint (self)
        run: cargo run --locked --manifest-path components/Cargo.toml -p poly-bundled --bin poly -- lint --workspace never .
      - name: poly fmt (self)
        run: cargo run --locked --manifest-path components/Cargo.toml -p poly-bundled --bin poly -- fmt .

  component-parity:
    # The sql family is left out of poly-core and served by the sql component built from this
    # tree; its lint and format output must equal the in-process snapshots byte for byte, and a
    # component whose hash does not match its lock must fail the run.
    name: component parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
      - name: Build the sql and astgrep components and write the dev lock
        run: mise run components:dev sql astgrep
      - name: Test poly-core in components mode
        run: mise run components:parity
      # A core build serves `poly rules` from the astgrep component; these only build without the
      # ast-grep engine family linked, so the workspace test run never reaches them.
      - name: poly rules from the astgrep component (core build)
        env:
          POLY_COMPONENT_DEV_LOCK: ${{ github.workspace }}/target/components/components.lock.json
        run: |
          cargo test --locked -p poly-cli --no-default-features --features dev-lock --test rules_core
          cargo test --locked -p poly-host-services --no-default-features --features dev-lock --test rules_component
      - name: poly rules without an embedded lock (core build)
        run: cargo test --locked -p poly-cli --no-default-features --features core --test rules_core

  go:
    # The Go sidecars under components/sidecars: vet, golangci-lint (govet, staticcheck, errcheck, gosec),
    # race tests, govulncheck, the licence allow-list and `go mod tidy -diff`, all through the mise task.
    name: go sidecars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: >-
            go golangci-lint
            go:golang.org/x/vuln/cmd/govulncheck
            go:github.com/google/go-licenses/v2
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('components/sidecars/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Vet, lint, test, vulnerabilities, licences, tidy
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sidecar:check

  sidecar-conformance:
    # The real sh sidecar, built and packaged as a release does, driven by the host through alef's stdio
    # transport and compared with the host shfmt byte for byte. POLY_REQUIRE_SIDECAR (set by the task)
    # fails the job if any of it was skipped.
    name: sidecar conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: go shfmt github:xberg-io/alef
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('components/sidecars/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Build, package and run the conformance tests
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sidecar:conformance

  sidecar-smoke:
    # The cross-compiled sh and go executables must start and answer a describe and a format call on the
    # platforms the conformance job (Linux) does not cover.
    name: sidecar smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: sh
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: sh.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: go
      - name: Build the executable for this platform
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          out="${GITHUB_WORKSPACE//\\//}/target/sidecar-smoke/${{ matrix.exe }}"
          mise run sidecar:build sh ${{ matrix.triple }} "$out"
          echo "POLY_SH_BINARY=$out" >> "$GITHUB_ENV"
      - name: Describe and format through the executable
        working-directory: components/sidecars/sh
        run: go test -count=1 -v -run TestBuiltExecutableDescribesAndFormats ./...
      - name: Build the go executable for this platform
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          out="${GITHUB_WORKSPACE//\\//}/target/sidecar-smoke/go-${{ matrix.exe }}"
          mise run sidecar:build go ${{ matrix.triple }} "$out"
          echo "POLY_GO_BINARY=$out" >> "$GITHUB_ENV"
      - name: Describe and format through the go executable
        working-directory: components/sidecars/go
        run: go test -count=1 -v -run TestBuiltExecutableDescribesAndFormats ./...

  # tsrs, the Rust port of the TypeScript 7 compiler, is pure Rust with its own lockfile (ADR 0051), so a native build
  # on each platform the component ships for is the whole check: the engine tests type-check real fixture projects
  # (the exact error codes and lines), and the component test loads the built cdylib through the host.
  tsrs:
    name: tsrs / ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components-tsrs
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:xberg-io/alef
      - name: Engine tests (type-checked fixture projects, options, version audit)
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path components-tsrs/Cargo.toml -p poly-engines-tsrs --no-fail-fast 2>&1 | tee tsrs-test.log
          # A green run that collected nothing proves nothing: the fixture projects must have run.
          grep -q "test result: ok. 14 passed" tsrs-test.log
      - name: Build the component cdylib
        run: cargo build --locked --release --manifest-path components-tsrs/Cargo.toml -p poly-engines-tsrs-component

  # kingfisher's rule engine links vectorscan (C++). Its -sys crate's build script fetches a checksum-verified prebuilt
  # archive for the target (cmake and Boost only for a source build), so whether it links, and scans, is a per-platform
  # question that only a native build answers (ADR 0054). Each leg builds the `secrets` component for one of the triples
  # it ships for (the musl binary is bundled and downloads no component) and runs the engine tests; the Linux, macOS and
  # Windows legs also load the component cdylib through the host. The alef-generated producer crate must be committed
  # (`mise run components:generate`): the job fails when it is missing rather than skipping it.
  secrets:
    name: secrets / ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components-secrets
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:xberg-io/alef
      - name: Engine tests (scan, redaction, allowlisting through the runner, version audit)
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path components-secrets/Cargo.toml -p poly-engines-secrets --no-fail-fast 2>&1 | tee secrets-test.log
          # A green run that collected nothing proves nothing: the fixtures must have run.
          grep -q "test result: ok. 7 passed" secrets-test.log
          grep -q "test result: ok. 4 passed" secrets-test.log
      - name: Build the component cdylib (links vectorscan for this triple)
        run: cargo build --locked --release --manifest-path components-secrets/Cargo.toml -p poly-engines-secrets-component
      # `components:dev` builds the component through alef for the runner's triple, and `secrets` ships for macOS only
      # among the runners here: Linux gnu is not an alef target until the release container builds vectorscan from
      # source, and the dev-lock task is untested on Windows (ADR 0054).
      - name: Load the component through the host (macOS only)
        if: runner.os == 'macOS'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          mise run components:dev secrets
          POLY_COMPONENT_DEV_LOCK="$GITHUB_WORKSPACE/target/components/components.lock.json" \
            cargo test --locked --manifest-path components-secrets/Cargo.toml -p poly-engines-secrets --test component -- --nocapture 2>&1 | tee component-test.log
          grep -q "test result: ok. 1 passed" component-test.log
          if grep -q "skipped: POLY_COMPONENT_DEV_LOCK" component-test.log; then echo "::error::the component test skipped"; exit 1; fi

  # The release builds the linux gnu components in a pinned manylinux_2_28 image so glibc 2.28 is the floor. The
  # vectorscan prebuilt archive is built on Ubuntu 22.04 (glibc 2.35), so whether it links against 2.28 is exactly what
  # the runner jobs above cannot show. The second x86_64 leg builds vectorscan from source (cmake and Boost) as the
  # fallback should the archive not link; it may fail without failing the workflow. Keep the images in step with
  # publish.yaml.
  secrets-manylinux:
    name: secrets / manylinux ${{ matrix.arch }}${{ matrix.features && ' (source build)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Informational until the release container builds vectorscan from source (ADR 0054): the prebuilt legs are
    # expected to fail on glibc 2.28, the source-build leg shows the path that works.
    continue-on-error: true
    env:
      RUST_TOOLCHAIN: "1.100.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
            features: ""
          - arch: aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.11.01-2@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676
            features: ""
          - arch: x86_64
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
            features: vectorscan-source
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in the manylinux_2_28 image
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work \
            -e RUST_TOOLCHAIN -e FEATURES -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/work/target/secrets-container/cargo -e RUSTUP_HOME=/work/target/secrets-container/rustup \
            -e CARGO_TARGET_DIR=/work/target/secrets-container/target \
            "${{ matrix.image }}" bash -euo pipefail -c '
              git config --global --add safe.directory /work
              if [ -n "$FEATURES" ]; then
                # The image ships no Boost headers; the source build needs them and cmake. A yum package here, not a
                # mise tool: the image is the release build environment and installs no tools.
                yum install -y boost-devel cmake
                flags="--features poly-engines-secrets/$FEATURES"
                test_flags="--features $FEATURES"
              else
                flags=""
                test_flags=""
              fi
              curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              export PATH="$CARGO_HOME/bin:$PATH"
              cargo test --locked --manifest-path components-secrets/Cargo.toml -p poly-engines-secrets --no-fail-fast $test_flags
              cargo build --locked --release --manifest-path components-secrets/Cargo.toml -p poly-engines-secrets-component $flags
              chown -R "$HOST_UID:$HOST_GID" target
            '

  alef-verify:
    # The checked-in alef outputs (producer crate, host module, versions) must match alef.toml.
    name: alef verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
      - name: alef verify
        run: mise x -- alef verify

  core-no-oxc:
    name: core links no oxc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
      - run: mise run check:core-no-oxc
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - name: the released core flavour builds warning-free
        run: cargo clippy --locked -p poly-cli --no-default-features --features core -- -D warnings
      - name: no git dependencies in the root workspace
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run check:deps

  # The released core ships on every download, so its size is gated on the largest native triple
  # (ADR 0039, ADR 0043): a fat-LTO `--profile core` build must stay under 14 MiB.
  core-size:
    name: core under 14 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
      - run: mise run check:core-size
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # The release builds linux gnu components in this container through `mise run components:release`, with a
  # musl mise and alef the host fetched; the plan step runs the same path without compiling, so a broken
  # container invocation fails here rather than in a release. Keep the image in step with publish.yaml.
  component-release-container:
    name: component release (manylinux plan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: x86_64-unknown-linux-gnu
      RUST_TOOLCHAIN: "1.100.0"
      BUILD_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
      - name: Fetch alef and mise for the container
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          mkdir -p target/components-release
          echo '{}' > target/components-release/previous-lock.json
          alef="$(mise run components:release fetch-alef)"
          mise_bin="$(mise run components:release fetch-mise)"
          jq_bin="$(mise run components:release fetch-jq)"
          {
            echo "ALEF_IN_CONTAINER=/work/${alef#"$PWD"/}"
            echo "MISE_IN_CONTAINER=/work/${mise_bin#"$PWD"/}"
            echo "JQ_IN_CONTAINER=/work/${jq_bin#"$PWD"/}"
            echo "GOROOT_ON_HOST=$(go env GOROOT)"
          } >> "$GITHUB_ENV"
      # The sh component is a Go executable: alef fingerprints it with `go version`, so the plan
      # needs the host's Go, mounted read-only as publish.yaml does.
      - name: Plan components in the container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -v "$GOROOT_ON_HOST":/opt/go:ro -w /work \
            -e TARGET -e RUST_TOOLCHAIN -e BUILD_IMAGE -e ALEF="$ALEF_IN_CONTAINER" \
            -e MISE_IN_CONTAINER -e JQ_IN_CONTAINER -e MISE_TASK_RUN_AUTO_INSTALL=false -e MISE_AUTO_INSTALL=false -e MISE_YES=1 \
            -e MISE_TRUSTED_CONFIG_PATHS=/work \
            -e CARGO_HOME=/work/target/components-release/toolchain/cargo \
            -e RUSTUP_HOME=/work/target/components-release/toolchain/rustup \
            -e GOTOOLCHAIN=local -e GOFLAGS=-modcacherw \
            -e GOPATH=/work/target/components-release/toolchain/gopath \
            -e GOCACHE=/work/target/components-release/toolchain/gocache \
            "$BUILD_IMAGE" bash -euo pipefail -c '
              git config --global --add safe.directory /work
              curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --target "$TARGET"
              export PATH="$CARGO_HOME/bin:/opt/go/bin:$(dirname "$MISE_IN_CONTAINER"):$(dirname "$JQ_IN_CONTAINER"):$PATH"
              mise run components:release plan "$TARGET"
            '
          rows="$(jq '[.rows[] | select(.action == "build")] | length' "target/components-release/$TARGET/plan/plan.json")"
          echo "planned builds: $rows"
          [[ "$rows" -gt 0 ]]

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-deny (components workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: components/Cargo.toml
          arguments: --all-features --config components/deny.toml
      - name: cargo-deny (pyrefly workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: components-pyrefly/Cargo.toml
          arguments: --all-features --config components-pyrefly/deny.toml
      - name: cargo-deny (secrets workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: components-secrets/Cargo.toml
          arguments: --all-features --config components-secrets/deny.toml
      - name: cargo-deny (tsrs workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: components-tsrs/Cargo.toml
          arguments: --all-features --config components-tsrs/deny.toml
