name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      plugins-only:
        description: "Publish current main plugin packages only; skip existing versions"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: false
        type: string
      rebuild_components:
        description: "Rebuild every component instead of reusing the previous release's unchanged assets"
        type: boolean
        default: false
      skip_ci_check:
        description: "Skip the check that CI succeeded on the release commit (emergency re-publish only)"
        type: boolean
        default: false

# RUST_TOOLCHAIN is pinned in several places that must be bumped together with Cargo.toml's
# rust-version and rust-toolchain.toml: every `RUST_TOOLCHAIN:` env, the `toolchain:` inputs of
# dtolnay/rust-toolchain, and the `rust:<minor>-alpine` image tag (and its digest) of the musl leg.

# Component signing (ADR 0060): build-components builds and packages without any secret;
# sign_components, on a fresh runner in the `release` environment that builds nothing, checks the
# unsigned archives against the build job's digest manifest and signs each with `alef component sign`
# and the Ed25519 private key in the environment secret
# POLY_COMPONENT_SIGNING_KEY (PKCS#8 PEM, or base64 of the PKCS#8 DER or a raw 32-byte seed). Its
# public half is `poly-release-2` in alef.toml ([crates.component_distribution.public_keys]); the
# rotation procedure is in the ADR and docs/release-runbook.md. A missing secret fails the release.
# The Homebrew tap, the Scoop bucket and the major-tag move authenticate with tokens minted from the
# polylint organization's GitHub App (org secrets BOT_APP_ID / BOT_APP_PRIVATE_KEY); no personal
# access token is involved.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read-only by default. The few jobs that write to the release (create_release,
# publish_assets, finalize_release, the major tag) or must see a draft release (meta) ask for
# `contents: write` themselves, and no job that compiles code holds a write token. The npm and PyPI
# jobs additionally request `id-token: write` on themselves, because trusted publishing (OIDC) mints
# its token from that claim.
permissions:
  contents: read

jobs:
  plugin-meta:
    name: Verify plugin-only dispatch metadata
    if: inputs.plugins-only
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Read consistent current plugin versions
        id: version
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          if os.environ['DISPATCH_REF'] != 'refs/heads/main':
              raise SystemExit('Plugin-only publishing requires main')
          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          core = cargo.get('workspace', {}).get('package', cargo.get('package', {}))['version']
          npm = json.loads(Path('plugin/package.json').read_text())['version']
          hermes = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']['version']
          if not core or core != npm or core != hermes:
              raise SystemExit(f'Plugin versions disagree: core={core}, npm={npm}, Hermes={hermes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={core}\n')
          PY

  verify_ci:
    # Publishing is gated on CI: a tag pushed ahead of, or onto a commit that failed, the ci workflow
    # must not release. Tag pushes race CI, so the check polls for up to 60 minutes (test jobs have a
    # 60-minute timeout).
    if: ${{ !inputs.plugins-only }}
    name: Verify CI passed on the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require the ci workflow's checks to be green
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A dispatch runs on a branch head; the release is built from the tag, so check the tag's commit.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$DISPATCH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
              echo "::error::release tag is not a valid version tag"
              exit 1
            fi
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DISPATCH_TAG" --jq .sha)"
          else
            sha="$PUSH_SHA"
          fi
          echo "Checking CI on $sha"

          # Check-run names from .github/workflows/ci.yaml (matrix legs included). Keep in step with it.
          required=(
            "toolchain baseline"
            "fmt"
            "clippy (ubuntu-latest)"
            "clippy (macos-26)"
            "clippy (windows-latest)"
            "test / ubuntu-latest"
            "test / macos-26"
            "test / windows-latest"
            "test core flavour"
            "feature matrix"
            "plugin tests"
            "msrv"
            "dogfood / ubuntu-latest"
            "dogfood / windows-latest"
            "component parity"
            "go sidecars"
            "sidecar conformance"
            "sidecar smoke (macos-latest)"
            "sidecar smoke (windows-latest)"
            "r / x86_64-unknown-linux-gnu"
            "r / aarch64-unknown-linux-gnu"
            "r / aarch64-apple-darwin"
            "r / x86_64-pc-windows-msvc"
            "tsrs / x86_64-unknown-linux-gnu"
            "tsrs / aarch64-unknown-linux-gnu"
            "tsrs / aarch64-apple-darwin"
            "tsrs / x86_64-pc-windows-msvc"
            "secrets / x86_64-unknown-linux-gnu"
            "secrets / aarch64-unknown-linux-gnu"
            "secrets / aarch64-apple-darwin"
            "secrets / x86_64-pc-windows-msvc"
            "secrets / manylinux x86_64 (source build)"
            "secrets / manylinux aarch64 (source build)"
            "alef verify"
            "core links no oxc"
            "core under 22 MiB"
            "component release (manylinux plan)"
            "cargo-deny"
          )

          empty=0
          for attempt in $(seq 1 60); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv' > runs.tsv
            # A tag on a commit whose main-push CI run was replaced or cancelled never gets check-runs.
            if [ -s runs.tsv ]; then empty=0; else empty=$((empty + 1)); fi
            if [ "$empty" -ge 3 ]; then
              echo "::error::no CI run exists for this commit ($sha); re-run CI (workflow_dispatch of ci.yaml on the tag's commit) or dispatch publish with skip_ci_check=true"
              exit 1
            fi
            pending=()
            for name in "${required[@]}"; do
              # The newest run of a name wins, so a re-run after a failure counts.
              row="$(awk -F'\t' -v n="$name" '$1 == n { r = $0 } END { print r }' runs.tsv)"
              if [ -z "$row" ]; then
                pending+=("$name (not started)")
                continue
              fi
              status="$(cut -f2 <<< "$row")"
              conclusion="$(cut -f3 <<< "$row")"
              if [ "$status" != "completed" ]; then
                pending+=("$name ($status)")
              elif [ "$conclusion" != "success" ]; then
                echo "::error::CI check '$name' concluded '$conclusion' on $sha"
                exit 1
              fi
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              echo "All ${#required[@]} required CI checks succeeded on $sha"
              exit 0
            fi
            echo "Waiting for CI (attempt $attempt/60): ${pending[*]}"
            [ "$attempt" -lt 60 ] && sleep 60
          done
          echo "::error::CI did not finish green on $sha within 60 minutes"
          exit 1

  meta:
    needs: verify_ci
    if: ${{ !inputs.plugins-only }}
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      # A draft release, and so whether a failed run left one complete, is visible only to a token
      # with write access.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      - name: Validate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::release tag is not a valid version tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo version: $version"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          target_version="${{ steps.version.outputs.version }}"

          echo "Verifying version consistency for: $target_version"

          # Check Cargo.toml workspace version
          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target_version" ]; then
            echo "::error::Cargo.toml version mismatch: expected $target_version, got $cargo_version"
            exit 1
          fi

          # The components workspace versions the musl bundled binary and every component archive.
          components_version="$(grep -E '^version = "' components/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$components_version" != "$target_version" ]; then
            echo "::error::components/Cargo.toml version mismatch: expected $target_version, got $components_version"
            exit 1
          fi

          # The pyrefly workspace is built separately (jemalloc 0.7 cannot share a lockfile with components/).
          pyrefly_version="$(grep -E '^version = "' components-pyrefly/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$pyrefly_version" != "$target_version" ]; then
            echo "::error::components-pyrefly/Cargo.toml version mismatch: expected $target_version, got $pyrefly_version"
            exit 1
          fi

          # The R workspace is built separately: air and jarl pin a biome revision of their own.
          r_version="$(grep -E '^version = "' components-r/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$r_version" != "$target_version" ]; then
            echo "::error::components-r/Cargo.toml version mismatch: expected $target_version, got $r_version"
            exit 1
          fi

          # The secrets workspace is built separately (kingfisher's native vectorscan build stays out of the other lockfiles).
          secrets_version="$(grep -E '^version = "' components-secrets/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$secrets_version" != "$target_version" ]; then
            echo "::error::components-secrets/Cargo.toml version mismatch: expected $target_version, got $secrets_version"
            exit 1
          fi

          # The tsrs workspace is built separately: tsrs's exact ICU pins cannot share a lockfile with the SQL engine.
          tsrs_version="$(grep -E '^version = "' components-tsrs/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$tsrs_version" != "$target_version" ]; then
            echo "::error::components-tsrs/Cargo.toml version mismatch: expected $target_version, got $tsrs_version"
            exit 1
          fi

          plugin_version="$(jq -r '.version' plugin/package.json)"
          if [ "$plugin_version" != "$target_version" ]; then
            echo "::error::Agent plugin version mismatch: expected $target_version, got $plugin_version"
            exit 1
          fi

          # The wrapper packages ship in lock-step (mise run release:bump moves
          # them with Cargo.toml). Check them here too: a package publishing the
          # wrong version is not recoverable — npm and PyPI both refuse to
          # overwrite a released version.
          npm_version="$(jq -r '.version' npm-package/package.json)"
          if [ "$npm_version" != "$target_version" ]; then
            echo "::error::npm-package/package.json version mismatch: expected $target_version, got $npm_version"
            exit 1
          fi

          for manifest in npm-package/platforms/*/package.json; do
            platform_version="$(jq -r '.version' "$manifest")"
            if [ "$platform_version" != "$target_version" ]; then
              echo "::error::$manifest version mismatch: expected $target_version, got $platform_version"
              exit 1
            fi
          done

          # The main package pins its platform packages exactly; a stale pin here
          # resolves to the previous release's binary under the new version.
          while read -r pinned; do
            if [ "$pinned" != "$target_version" ]; then
              echo "::error::npm-package/package.json optionalDependencies pin mismatch: expected $target_version, got $pinned"
              exit 1
            fi
          done < <(jq -r '.optionalDependencies[]' npm-package/package.json)

          pypi_version="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          if [ "$pypi_version" != "$target_version" ]; then
            echo "::error::pip-package/pyproject.toml version mismatch: expected $target_version, got $pypi_version"
            exit 1
          fi

          init_version="$(grep -E '^__version__ = "' pip-package/polylint/__init__.py | cut -d'"' -f2)"
          if [ "$init_version" != "$target_version" ]; then
            echo "::error::pip-package/polylint/__init__.py version mismatch: expected $target_version, got $init_version"
            exit 1
          fi

          echo "✓ Version verified across Cargo + npm + PyPI: $cargo_version"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          release_assets_exist=false

          # Complete means sha256sums.txt is uploaded, which happens only after every binary is. A
          # draft left with partial assets by a failed run must be rebuilt, not skipped.
          if gh release view "$tag" >/dev/null 2>&1 &&
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'sha256sums.txt'; then
            release_assets_exist=true
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"

  create_release:
    name: Create GitHub release
    needs: meta
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Reads the previous release lock's attestation before reusing its entries.
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            # A pre-existing release can be live but incomplete — a re-run, a
            # tag pushed twice, or a release created outside this workflow. In
            # that state it is what /releases/latest resolves to, so every
            # consumer's installer picks it up and then fails the checksum
            # verification, because sha256sums.txt is not uploaded until the
            # whole build matrix finishes. Put it back into draft until
            # finalize_release has verified the full asset set. A release that
            # already carries sha256sums.txt is complete and is left alone.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft')" != "true" ] &&
              ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                grep -qx 'sha256sums.txt'; then
              echo "::warning::release $tag is published but has no sha256sums.txt; reverting to draft until its assets are complete"
              gh release edit "$tag" --draft=true --repo "$GITHUB_REPOSITORY"
            fi
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            # Create as a DRAFT. publish_assets uploads to it once every build has
            # passed, but it stays invisible (assets not publicly downloadable) until
            # the finalize_release job promotes it. A failed platform build therefore
            # leaves a hidden draft, not a live release with missing binaries and no
            # checksums.
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1

      # Fetched once so every build leg plans against, and the lock reuses from, the same lock.
      - name: Fetch the previous release's component lock
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILD_COMPONENTS: ${{ github.event.inputs.rebuild_components || 'false' }}
        run: mise run components:release previous-lock

      - name: Save the previous component lock
        uses: actions/upload-artifact@v7
        with:
          name: component-previous-lock
          path: target/components-release/previous-lock.json
          if-no-files-found: error

  third-party-licenses:
    name: Generate THIRD-PARTY-LICENSES.md
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.100.0"

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1

      - name: Generate the licence table and attributions
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run release:third-party-licenses THIRD-PARTY-LICENSES.md

      - name: Save the licence files for the archives
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: |
            THIRD-PARTY-LICENSES.md
            ATTRIBUTIONS.md
          if-no-files-found: error

  # Builds every component with no secret and a read-only token: build scripts and proc macros of the
  # whole dependency tree run here, so nothing this job can reach may sign or publish (ADR 0060). The
  # unsigned archives leave as one tar plus a digest manifest for sign_components.
  build-components:
    name: Build components / ${{ matrix.triple }}
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Part of each component's input hash, so a new image rebuilds instead of reusing. Empty
      # for the native builds.
      BUILD_IMAGE: ${{ matrix.image }}
      # One exact toolchain for every component build: the host setup, the manylinux container's
      # rustup and the input hash all use this value. Bump it deliberately; it rebuilds everything.
      RUST_TOOLCHAIN: "1.100.0"
    strategy:
      fail-fast: false
      # musl is absent on purpose: that binary is fully bundled and downloads no component.
      # sign_components repeats these triples: keep the two in step.
      matrix:
        include:
          # glibc is the floor the components' symbols are linked against, so the gnu builds run in
          # a pinned manylinux_2_28 image rather than on the runner's newer glibc. Bump the tag and
          # digest together.
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.11.01-2@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.triple }}

      # go builds the sh component, an executable producer (alef.toml); the manylinux containers get it by mount.
      # The CycloneDX tools write each built component's SBOM.
      - name: Setup mise (alef, go, SBOM tools)
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:xberg-io/alef go github:CycloneDX/cyclonedx-rust-cargo github:CycloneDX/cyclonedx-gomod

      - name: Download the previous component lock
        uses: actions/download-artifact@v8
        with:
          name: component-previous-lock
          path: target/components-release

      # The musl alef, the musl mise, jq and rustup-init are fetched here, on the host, checked against
      # the sha256 pinned in mise-tasks/components/release.sh, and reached through the /work mount.
      # The container has an old glibc and no mise, so it runs the same `mise run components:release`
      # task with the static binary and installs no tools (MISE_TASK_RUN_AUTO_INSTALL=false): alef
      # comes from ALEF, cargo and rustc from rustup.
      - name: Fetch alef and mise for the manylinux_2_28 container
        if: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          alef="$(mise run components:release fetch-alef)"
          mise_bin="$(mise run components:release fetch-mise)"
          jq_bin="$(mise run components:release fetch-jq)"
          rustup_init="$(mise run components:release fetch-rustup-init)"
          {
            echo "ALEF_IN_CONTAINER=/work/${alef#"$PWD"/}"
            echo "MISE_IN_CONTAINER=/work/${mise_bin#"$PWD"/}"
            echo "JQ_IN_CONTAINER=/work/${jq_bin#"$PWD"/}"
            echo "RUSTUP_INIT_IN_CONTAINER=/work/${rustup_init#"$PWD"/}"
            echo "GOROOT_ON_HOST=$(go env GOROOT)"
          } >> "$GITHUB_ENV"

      # rustup installs into CARGO_HOME/RUSTUP_HOME under the workspace. package runs in the same
      # container as build, so it recomputes the fingerprint the plan recorded.
      - name: Plan and build components (manylinux_2_28 container)
        if: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -v "$GOROOT_ON_HOST":/opt/go:ro -w /work \
            -e TARGET="${{ matrix.triple }}" -e RUST_TOOLCHAIN -e BUILD_IMAGE -e ALEF="$ALEF_IN_CONTAINER" \
            -e MISE_IN_CONTAINER -e JQ_IN_CONTAINER -e RUSTUP_INIT_IN_CONTAINER \
            -e MISE_TASK_RUN_AUTO_INSTALL=false -e MISE_AUTO_INSTALL=false -e MISE_YES=1 \
            -e MISE_TRUSTED_CONFIG_PATHS=/work \
            -e CARGO_HOME=/work/target/components-release/toolchain/cargo \
            -e RUSTUP_HOME=/work/target/components-release/toolchain/rustup \
            -e GOTOOLCHAIN=local -e GOFLAGS=-modcacherw \
            -e GOPATH=/work/target/components-release/toolchain/gopath \
            -e GOCACHE=/work/target/components-release/toolchain/gocache \
            -e VECTORSCAN_BUILD_FROM_SOURCE=1 \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "${{ matrix.image }}" bash -euo pipefail -c '
              git config --global --add safe.directory /work
              # The secrets component compiles vectorscan here: the prebuilt archive needs glibc 2.32 (#112).
              yum install -y boost-devel cmake
              "$RUSTUP_INIT_IN_CONTAINER" -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --target "$TARGET"
              export PATH="$CARGO_HOME/bin:/opt/go/bin:$(dirname "$MISE_IN_CONTAINER"):$(dirname "$JQ_IN_CONTAINER"):$PATH"
              mise run components:release plan "$TARGET"
              mise run components:release build "$TARGET"
              mise run components:release package "$TARGET"
              chown -R "$HOST_UID:$HOST_GID" target
            '

      - name: Plan components (input hashes, reuse against the previous lock)
        if: ${{ !matrix.image }}
        shell: bash
        run: mise run components:release plan "${{ matrix.triple }}"

      - name: Build components
        if: ${{ !matrix.image }}
        shell: bash
        run: mise run components:release build "${{ matrix.triple }}"

      - name: Package components (unsigned)
        if: ${{ !matrix.image }}
        shell: bash
        run: mise run components:release package "${{ matrix.triple }}"

      # Reads the same Cargo.lock and go.sum the build used, for the target triple; it builds nothing.
      - name: Write the SBOM of every component built here
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          out="target/components-release/${{ matrix.triple }}"
          mise run release:sbom components "${{ matrix.triple }}" "$out/sbom" "$out/plan/plan.json"

      - name: Save the component SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: component-sboms-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/sbom/
          # Empty when the plan reuses every component for this triple.
          if-no-files-found: ignore

      - name: Stage the unsigned archives and record their digests
        shell: bash
        run: mise run components:release stage "${{ matrix.triple }}"

      - name: Save the unsigned archives for signing
        uses: actions/upload-artifact@v7
        with:
          name: component-unsigned-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/unstaged/
          if-no-files-found: error

      # A separate artifact, so the signing job compares the archive tar with a manifest it downloads
      # on its own rather than with a file inside the same upload.
      - name: Save the digest manifest
        uses: actions/upload-artifact@v7
        with:
          name: component-digests-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/digests.sha256
          if-no-files-found: error

      - name: Save the plan for the lock
        uses: actions/upload-artifact@v7
        with:
          name: component-plan-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/plan/plan.json
          if-no-files-found: error

  # Signs the components on a fresh runner that builds nothing: it checks the build job's unsigned
  # archives against the digest manifest, then `alef component sign` validates each archive against its
  # record and the plan, signs it with the key and refuses a key that is not alef.toml's poly-release-2
  # (alef ADR-0026). sign loads no alef.toml and runs no cargo, rustc or go, so no dependency code runs
  # where the key is; `alef component verify` then parses only the checked-out contracts. The key lives
  # in the `release` environment, so a job outside it cannot read it, and this job holds no write
  # token. The signature does not depend on the host, so every triple signs on ubuntu-latest.
  sign_components:
    name: Sign components / ${{ matrix.triple }}
    needs: [meta, build-components]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        triple:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # alef's sha256 is pinned in mise.lock.
      - name: Setup mise (alef)
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:xberg-io/alef

      - name: Download the unsigned archives
        uses: actions/download-artifact@v8
        with:
          name: component-unsigned-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/unstaged

      - name: Download the digest manifest
        uses: actions/download-artifact@v8
        with:
          name: component-digests-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}

      - name: Check the archives against the digests and put them in place
        shell: bash
        run: mise run components:release unstage "${{ matrix.triple }}"

      - name: Sign components
        shell: bash
        env:
          POLY_COMPONENT_SIGNING_KEY: ${{ secrets.POLY_COMPONENT_SIGNING_KEY }}
        run: mise run components:release sign "${{ matrix.triple }}"

      - name: Save the signed components for the lock and checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-components-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/dist/*
          # Empty when the plan reuses every component for this triple.
          if-no-files-found: ignore

  component-lock:
    name: Merge the component lock
    needs: [meta, sign_components]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup mise (alef)
        uses: xberg-io/actions/setup-mise@v1

      - name: Download every triple's signed components
        # Absent when the plan reuses every component on every triple.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: releases-components-*
          merge-multiple: true
          path: components

      - name: Download every triple's plan
        uses: actions/download-artifact@v8
        with:
          pattern: component-plan-*
          path: plans

      - name: Download the previous component lock
        uses: actions/download-artifact@v8
        with:
          name: component-previous-lock
          path: target/components-release

      - name: Merge into one signed lock (reused entries carried over)
        run: mise run components:release lock plans components poly-components.lock.json

      - name: Download every triple's component SBOMs
        # Absent when the plan reuses every component on every triple.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: component-sboms-*
          path: sboms

      # Each built archive's SBOM becomes the release asset <archive>.cdx.json, matched through the
      # signed record's identity rather than by guessing the archive name.
      - name: Name each component SBOM after its archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p component-sboms
          n=0
          for record in components/*.record.json; do
            archive="$(jq -er .archive "$record")"
            component="$(jq -er .manifest.identity.component "$record")"
            target="$(jq -er .manifest.identity.target "$record")"
            sbom="sboms/component-sboms-$target/$component.cdx.json"
            [ -f "$sbom" ] || { echo "::error::no SBOM for $component on $target ($archive)"; exit 1; }
            cp "$sbom" "component-sboms/$archive.cdx.json"
            n=$((n + 1))
          done
          echo "named $n component SBOMs"

      - name: Save the component SBOMs for the checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-components-sboms
          path: component-sboms/
          if-no-files-found: ignore

      - name: Assert the lock is complete and signed
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          REBUILD_COMPONENTS: ${{ github.event.inputs.rebuild_components || 'false' }}
        run: |
          set -euo pipefail
          plan=target/components-release/plan.json
          total="$(jq '.rows | length' "$plan")"
          to_build="$(jq '[.rows[] | select(.action == "build")] | length' "$plan")"
          # Every configured component on every configured target, so a triple or component that
          # silently dropped out of the matrix or the plan fails here rather than at a user's first run.
          expected="$(python3 -c 'import tomllib; d = tomllib.load(open("alef.toml", "rb")); print(sum(len(c.get("targets", [])) for crate in d["crates"] for c in crate.get("components", [])))')"
          [ "$total" -gt 0 ] && [ "$total" -eq "$expected" ] || {
            echo "::error::the merged plan has $total rows; alef.toml configures $expected component builds"
            exit 1
          }
          [ "$REBUILD_COMPONENTS" != "true" ] || [ "$to_build" -eq "$total" ] || {
            echo "::error::rebuild requested but the plan reuses $((total - to_build)) of $total components"
            exit 1
          }
          prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/"
          # The lock must carry exactly alef.toml's trusted keys, by value: a lock whose key id matches
          # but whose key does not would make every binary embedding it trust a key nobody reviewed.
          keys="$(mise run components:release public-keys)"
          signing="$(sed -n 's/^KEY_ID="\(.*\)"$/\1/p' mise-tasks/components/release.sh)"
          jq -e --argjson total "$total" --argjson built "$to_build" --arg prefix "$prefix" --arg tag_prefix "${prefix}${RELEASE_TAG}/" \
            --argjson keys "$keys" --arg signing "$signing" '
            (.artifacts | length) == $total
            and ([.artifacts[] | select(.url | startswith($tag_prefix))] | length) == $built
            and ($keys | has($signing))
            and (.public_keys == $keys)
            and all(.artifacts[]; .key_id as $k | ($keys | has($k)) and (.url | startswith($prefix)))
            and all(.artifacts[] | select(.url | startswith($tag_prefix)); .key_id == $signing)
          ' poly-components.lock.json >/dev/null || {
            echo "::error::component lock is incomplete, unsigned, or does not match the plan ($total entries, $to_build built for $RELEASE_TAG)"
            jq '{public_keys, artifacts: [.artifacts[] | {c: .identity.component, t: .identity.target, key: .key_id, url}]}' poly-components.lock.json
            exit 1
          }
          echo "lock carries $total signed artifacts ($to_build built for $RELEASE_TAG, $((total - to_build)) reused)"

      - name: Save the lock for the core builds and checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-components-lock
          path: poly-components.lock.json
          if-no-files-found: error

  build-binaries:
    name: Build binaries / ${{ matrix.triple }}
    # The component lock is embedded in every build that downloads components (all but musl).
    needs: [meta, create_release, component-lock, third-party-licenses]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ${{ matrix.os }}
    # Like build-components: dependency build code runs here, so no secret and no write token.
    permissions:
      contents: read
    # Stamp the build id from the tag we are releasing rather than leaving
    # build.rs to infer it from `git describe`. The release also force-moves the
    # `v0` major tag onto this commit, so a later workflow_dispatch re-run — the
    # only path that rebuilds — can have `git describe` resolve `v0`, whose
    # stripped form is "0" rather than the version, silently stamping a release
    # artifact as a `dev` build. An explicit id is what build.rs documents this
    # variable for.
    env:
      POLY_BUILD_ID: ${{ needs.meta.outputs.tag }}
      # The toolchain build-components uses and the musl leg's rust:1.100-alpine image; Cargo.toml's
      # rust-version is the floor (the ci msrv job). Bump them together.
      RUST_TOOLCHAIN: "1.100.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            alpine: true
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"

      - name: Name the directory the binary is built into
        # The core is built with `--profile core` (target/<triple>/core); the musl bundled build
        # keeps the release profile.
        run: echo "PROFILE_DIR=${{ matrix.alpine && 'release' || 'core' }}" >> "$GITHUB_ENV"
        shell: bash

      # The musl leg builds in its container; the host toolchain there only reads metadata for the SBOM.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.triple }}

      # cargo-auditable embeds the dependency list in the binary; cargo-cyclonedx writes its SBOM.
      - name: Setup mise (cargo-auditable, cargo-cyclonedx)
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:rust-secure-code/cargo-auditable github:CycloneDX/cyclonedx-rust-cargo

      - name: Install clang for bindgen (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
        shell: bash

      - name: Download the component lock
        uses: actions/download-artifact@v8
        with:
          name: releases-components-lock
          path: components-lock

      # The smoke test serves this tag's components from the signed artifacts: they reach the release
      # only once every build has passed.
      - name: Download this release's signed components
        if: ${{ matrix.alpine != true }}
        # Absent when the plan reuses every component on every triple.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: releases-components-*-*
          merge-multiple: true
          path: components-dist

      - name: Build binary (native, component lock embedded)
        if: ${{ !matrix.alpine }}
        env:
          # Read by crates/poly-core/build.rs and compiled into the binary.
          POLY_COMPONENT_LOCK_FILE: ${{ github.workspace }}/components-lock/poly-components.lock.json
        # The core flavour (ADR 0039): every other engine family and the MCP server are components
        # this binary downloads on first use, from the lock embedded above.
        run: cargo auditable build --profile core --locked --target ${{ matrix.triple }} -p poly-cli --no-default-features --features core
        shell: bash

      - name: Build binary (musl, Alpine container)
        if: ${{ matrix.alpine }}
        env:
          # Pinned by digest so a re-pushed tag cannot change the bundled build. Bump tag and digest
          # together: `docker buildx imagetools inspect rust:<minor>-alpine` prints the index digest.
          MUSL_BUILD_IMAGE: rust:1.100-alpine@sha256:de1e0058543a81ed7b046629167db587c67a94bdf37cce14eb27f0ec83baaffb
        run: |
          # Build host-native inside rust:1.100-alpine (the image's host target IS x86_64-unknown-linux-musl),
          # dynamically linked against musl (-crt-static off). It must stay dynamic: tree-sitter grammars
          # are downloaded on demand and dlopen'd, and a static musl executable cannot dlopen, so a
          # crt-static build errors on every file whose grammar is not compiled in.
          #
          # A dynamic musl build links std's unwinder as `-lgcc_s`, a runtime dependency on
          # libgcc_s.so.1 that stock Alpine does not ship (#142: `_Unwind_Backtrace: symbol not
          # found`). A `libgcc_s.a` on the search path that is the static LLVM libunwind rustup ships for
          # this target (the unwinder a crt-static build links) satisfies that `-lgcc_s` at link time,
          # so the binary needs nothing but musl's libc and loader, which every Alpine has. Then place
          # the binary at the triple path the shared packaging step expects. The musl build is the
          # poly-bundled crate of the components/ workspace (every engine statically linked, including
          # the git-pinned oxc, biome and rubyfmt ones) and is given no POLY_COMPONENT_LOCK_FILE, so it
          # embeds no lock and downloads no component. CARGO_TARGET_DIR puts its output at
          # target/release/poly. cargo-auditable is the static musl build mise installed on the host (its real
          # path, not a shim, so the container can run it).
          auditable="$(mise which cargo-auditable)"
          docker run --rm -v "$PWD":/work -v "$(dirname "$auditable")":/opt/cargo-auditable:ro -w /work \
            -e CARGO_TARGET_DIR=/work/target \
            -e POLY_BUILD_ID="$POLY_BUILD_ID" \
            "$MUSL_BUILD_IMAGE" sh -c '
              set -e
              apk add --no-cache build-base musl-dev pkgconf git perl
              unwind="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n "s/^host: //p")/lib/self-contained/libunwind.a"
              test -f "$unwind"
              mkdir -p /tmp/static-unwind
              ln -sf "$unwind" /tmp/static-unwind/libgcc_s.a
              export RUSTFLAGS="-C target-feature=-crt-static -L native=/tmp/static-unwind"
              export PATH="/opt/cargo-auditable:$PATH"
              cargo auditable build --release --locked --manifest-path components/Cargo.toml -p poly-bundled
              mkdir -p "target/${{ matrix.triple }}/release"
              cp target/release/poly "target/${{ matrix.triple }}/release/poly"
              strip "target/${{ matrix.triple }}/release/poly"
            '
          # The container ran as root; later steps write into target/ as the runner user.
          sudo chown -R "$(id -u):$(id -g)" target
        shell: bash

      - name: Smoke-test the musl binary on stock Alpine
        # The archive's promise is a binary that runs on a bare musl system. Its only shared library
        # must be musl's libc, so a dependency such as libgcc_s fails here, not on a user's machine.
        # Then run it in plain alpine:3.20 with nothing installed: `--version`, and a lint and format
        # of one file per engine family it links. The lint also fetches and dlopens tree-sitter
        # grammars (the built-in ast-grep rules), which a static build cannot do.
        if: ${{ matrix.alpine }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/release/poly"
          needed="$(readelf -dW "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tr '\n' ' ')"
          echo "NEEDED: $needed"
          [ "$needed" = "libc.musl-x86_64.so.1 " ] || { echo "::error::the musl binary needs more than musl libc: $needed"; exit 1; }
          readelf -lW "$bin" | grep -q 'interpreter: /lib/ld-musl-x86_64.so.1' \
            || { echo "::error::the musl binary does not use the musl loader"; readelf -lW "$bin" | grep -i interp; exit 1; }
          fixture="$RUNNER_TEMP/smoke-musl"
          mkdir -p "$fixture"
          printf 'import os\n' > "$fixture/a.py"
          printf 'const a = 1;\n' > "$fixture/a.ts"
          printf 'puts 1\n' > "$fixture/a.rb"
          printf 'a { color: red; }\n' > "$fixture/a.css"
          printf '[a]\nk = 1\n' > "$fixture/a.ini"
          files="$(find "$fixture" -type f | wc -l | tr -d ' ')"
          cp "$bin" "$RUNNER_TEMP/poly-musl"
          docker run --rm --platform linux/amd64 -v "$RUNNER_TEMP":/t -w /t/smoke-musl alpine:3.20 sh -c '
            set -e
            /t/poly-musl --version
            set +e
            /t/poly-musl lint --workspace never --no-cache --format json . > /t/musl-lint.json; echo "$?" > /t/musl-lint.rc
            /t/poly-musl fmt --no-cache --format json . > /t/musl-fmt.json; echo "$?" > /t/musl-fmt.rc
          '
          for mode in lint fmt; do
            code="$(cat "$RUNNER_TEMP/musl-$mode.rc")"
            [ "$code" -le 1 ] || { cat "$RUNNER_TEMP/musl-$mode.json"; echo "::error::poly $mode exited $code on stock Alpine"; exit 1; }
            jq -e --argjson n "$files" '.summary.errored == 0 and (.errors | length) == 0 and .summary.checked == $n' \
              "$RUNNER_TEMP/musl-$mode.json" > /dev/null || { cat "$RUNNER_TEMP/musl-$mode.json"; echo "::error::poly $mode did not check all $files files on stock Alpine"; exit 1; }
            echo "poly $mode on alpine:3.20: $(jq -c .summary "$RUNNER_TEMP/musl-$mode.json")"
          done
        shell: bash

      - name: Strip binary
        if: ${{ !matrix.alpine }}
        run: |
          case "${{ matrix.triple }}" in
            *windows*)
              # Windows binaries don't benefit from strip
              ;;
            *)
              strip target/${{ matrix.triple }}/$PROFILE_DIR/poly || true
              ;;
          esac
        shell: bash

      - name: Assert the binary was built without dev-lock
        # The `dev-lock` feature is the only code that names POLY_COMPONENT_DEV_LOCK, so the name
        # appearing in the binary means a development lock path is compiled into the release.
        # Reading the artifact (not the cargo invocation or `cargo tree`) covers every way the
        # feature could be switched on, and needs no execution, so it also works for the musl
        # build made in a container and for cross-built targets.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          test -s "$bin" || { echo "::error::no binary at $bin"; exit 1; }
          if grep -aq POLY_COMPONENT_DEV_LOCK "$bin"; then
            echo "::error::$bin was built with the dev-lock feature"
            exit 1
          fi
          echo "dev-lock absent from $bin"
        shell: bash

      - name: Assert the dependency list is embedded (cargo-auditable)
        # cargo-auditable stores the dependency tree in a `.dep-v0` linker section (ELF, Mach-O and PE), whose
        # name is in the binary's section table, so reading the artifact shows the build carries it.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          grep -aq '\.dep-v0' "$bin" || { echo "::error::$bin has no .dep-v0 section; was it built with cargo auditable?"; exit 1; }
          echo "dependency list embedded in $bin"
        shell: bash

      - name: Assert the core is under 22 MiB
        # The ceiling is for the shipped binary, lock included, on the largest native triple.
        if: ${{ matrix.triple == 'x86_64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          size="$(wc -c < "target/${{ matrix.triple }}/$PROFILE_DIR/poly" | tr -d ' ')"
          echo "core binary: $size bytes"
          [ "$size" -gt 1000000 ] && [ "$size" -le 23068672 ] || { echo "::error::the core binary is $size bytes, outside 1 MB..22 MiB (ADR 0065)"; exit 1; }
        shell: bash

      - name: Assert the component lock is embedded (absent for musl)
        # The lock's URLs are string data in the binary only when build.rs embedded the lock, so
        # reading the artifact shows what the build actually carries. The binary path is the one
        # the build steps above produce: the musl container copies target/release/poly to it.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          test -s "$bin" || { echo "::error::no binary at $bin"; exit 1; }
          lock=components-lock/poly-components.lock.json
          total="$(jq -er '.artifacts | length' "$lock")"
          [ "$total" -gt 0 ] || { echo "::error::the component lock lists no artifacts"; exit 1; }
          found=0
          # jq.exe on Windows ends lines in CRLF; a URL keeping its \r matches nothing in the binary.
          while IFS= read -r url; do
            url="${url%$'\r'}"
            if grep -aqF "$url" "$bin"; then found=$((found + 1)); fi
          done < <(jq -er '.artifacts[].url' "$lock")
          if [ "${{ matrix.alpine }}" = "true" ]; then
            [ "$found" -eq 0 ] || { echo "::error::the musl binary embeds $found of $total component artifact URLs"; exit 1; }
            echo "no component lock in $bin (0 of $total URLs)"
          else
            [ "$found" -eq "$total" ] || { echo "::error::$bin embeds $found of $total component artifact URLs"; exit 1; }
            echo "component lock embedded in $bin ($found of $total URLs)"
          fi
        shell: bash

      - name: Smoke-test the core binary against this release's components
        # Runs the binary users get: it installs every component of its triple through the embedded,
        # signed lock (this tag's assets from the signed artifacts, reused ones from their published
        # release, into a localhost mirror, so each lock URL keeps its path) and lints and formats one
        # file per component language. A wrong signing key, a component that does not load, or an
        # engine that errors fails the release here.
        if: ${{ matrix.alpine != true }}
        env:
          # Reads the published releases reused entries point at; this job's token is read-only.
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          bin="$PWD/target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          lock=components-lock/poly-components.lock.json
          mirror="$RUNNER_TEMP/component-mirror"
          rows=0
          while IFS= read -r url; do
            url="${url%$'\r'}"
            path="${url#https://github.com/}"
            tag="$(echo "$path" | cut -d/ -f5)"
            dir="$mirror/$(dirname "$path")"
            mkdir -p "$dir"
            if [ "$tag" = "$RELEASE_TAG" ]; then
              cp "components-dist/$(basename "$path")" "$dir/"
            else
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$path")" --dir "$dir" --clobber
            fi
            rows=$((rows + 1))
          done < <(jq -er --arg t "${{ matrix.triple }}" '.artifacts[] | select(.identity.target == $t) | .url' "$lock")
          [ "$rows" -gt 0 ] || { echo "::error::the lock has no components for ${{ matrix.triple }}"; exit 1; }
          py="$(command -v python3 || command -v python)"
          (cd "$mirror" && "$py" -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          export POLY_COMPONENT_MIRROR=http://127.0.0.1:8765 POLY_COMPONENT_CACHE="$RUNNER_TEMP/component-cache"
          "$bin" components install all
          fixture="$RUNNER_TEMP/smoke"
          mkdir -p "$fixture"
          printf 'import os\n' > "$fixture/a.py"
          printf 'const a = 1;\n' > "$fixture/a.ts"
          printf 'select 1\n' > "$fixture/a.sql"
          printf '<?php\necho 1;\n' > "$fixture/a.php"
          printf '{ a = 1; }\n' > "$fixture/a.nix"
          printf 'puts 1\n' > "$fixture/a.rb"
          printf 'a { color: red; }\n' > "$fixture/a.css"
          printf 'query { a }\n' > "$fixture/a.graphql"
          printf 'FROM alpine\n' > "$fixture/Dockerfile"
          printf 'a = 1\n' > "$fixture/a.toml"
          printf '# a\n' > "$fixture/a.md"
          printf '[a]\nk = 1\n' > "$fixture/a.ini"
          printf 'local a = 1\n' > "$fixture/a.lua"
          files="$(find "$fixture" -type f | wc -l | tr -d ' ')"
          for mode in lint fmt; do
            set +e
            if [ "$mode" = lint ]; then
              "$bin" lint --workspace never --no-cache --format json "$fixture" > "$RUNNER_TEMP/$mode.json"
            else
              "$bin" fmt --no-cache --format json "$fixture" > "$RUNNER_TEMP/$mode.json"
            fi
            code=$?
            set -e
            [ "$code" -le 1 ] || { cat "$RUNNER_TEMP/$mode.json"; echo "::error::poly $mode exited $code"; exit 1; }
            # Lint skips a.nix (alejandra formats only); every other file must be checked, none errored.
            jq -e --argjson n "$files" --arg mode "$mode" '
              .summary.errored == 0 and (.errors | length) == 0
              and (if $mode == "lint" then .summary.checked + .summary.skipped == $n else .summary.checked == $n end)' \
              "$RUNNER_TEMP/$mode.json" > /dev/null || { cat "$RUNNER_TEMP/$mode.json"; echo "::error::poly $mode did not check all $files files cleanly"; exit 1; }
            echo "poly $mode: $(jq -c .summary "$RUNNER_TEMP/$mode.json")"
          done
          # uncomment is opt-in and outside the `all` preset: install it, enable it, and require a diagnostic.
          "$bin" components install uncomment
          uncomment_dir="$RUNNER_TEMP/smoke-uncomment"
          mkdir -p "$uncomment_dir"
          # code_only = false: the default flags only commented-out code, and this also proves a bool key reaches the component.
          printf '[lint.uncomment]\nenabled = true\ncode_only = false\n' > "$uncomment_dir/poly.toml"
          printf 'x = 1\n# a removable comment\n' > "$uncomment_dir/a.py"
          set +e
          "$bin" lint --workspace never --no-cache --only uncomment --format json "$uncomment_dir" > "$RUNNER_TEMP/uncomment.json"
          code=$?
          set -e
          [ "$code" -le 1 ] || { cat "$RUNNER_TEMP/uncomment.json"; echo "::error::poly lint (uncomment) exited $code"; exit 1; }
          jq -e '.summary.errored == 0 and ([.results[].diagnostics[] | select(.engine == "uncomment")] | length) > 0' \
            "$RUNNER_TEMP/uncomment.json" > /dev/null || { cat "$RUNNER_TEMP/uncomment.json"; echo "::error::the uncomment component reported nothing"; exit 1; }
          echo "poly lint (uncomment): $(jq -c .summary "$RUNNER_TEMP/uncomment.json")"
        shell: bash

      - name: Download the licence files
        uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: third-party-licenses

      # The binary statically links third-party code whose licences, and the tsrs NOTICE, must travel
      # with it, so the archive carries them next to the executable.
      - name: Create release artifacts
        run: |
          set -euo pipefail
          for f in ATTRIBUTIONS.md THIRD-PARTY-LICENSES.md; do
            cp "third-party-licenses/$f" "target/${{ matrix.triple }}/$PROFILE_DIR/$f"
          done
          cd target/${{ matrix.triple }}/$PROFILE_DIR

          case "${{ matrix.triple }}" in
            *windows*)
              7z a ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip poly.exe ATTRIBUTIONS.md THIRD-PARTY-LICENSES.md
              listing="$(7z l -ba ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip)"
              ;;
            *)
              tar czf ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz poly ATTRIBUTIONS.md THIRD-PARTY-LICENSES.md
              listing="$(tar -tzf ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz)"
              ;;
          esac
          for f in ATTRIBUTIONS.md THIRD-PARTY-LICENSES.md; do
            grep -q -- "$f" <<< "$listing" || { echo "::error::the archive is missing $f"; exit 1; }
          done
        shell: bash

      # The SBOM of the archive's binary, from the same manifest, features and target it was built with.
      - name: Write the archive's SBOM
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          case "${{ matrix.triple }}" in
            *windows*) archive="poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip" ;;
            *) archive="poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz" ;;
          esac
          if [ "${{ matrix.alpine }}" = "true" ]; then
            mise run release:sbom binary "${{ matrix.triple }}" "$archive.cdx.json" components/crates/poly-bundled/Cargo.toml
          else
            mise run release:sbom binary "${{ matrix.triple }}" "$archive.cdx.json" crates/poly-cli/Cargo.toml \
              --no-default-features --features core
          fi
        shell: bash

      - name: Save artifact for checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-${{ matrix.triple }}
          path: |
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.*.cdx.json
          if-no-files-found: error

  checksums:
    if: ${{ !inputs.plugins-only }}
    name: Generate checksums
    needs: [meta, build-binaries, sign_components, component-lock]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sbom_pairs: ${{ steps.sbom_pairs.outputs.pairs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: releases-*
          merge-multiple: true
          path: artifacts

      - name: Verify all expected archives are present
        run: |
          set -euo pipefail

          # Expected archives for the 5 build targets
          expected=(
            "poly-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-aarch64-apple-darwin.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-pc-windows-msvc.zip"
          )

          missing_count=0
          for expected_asset in "${expected[@]}"; do
            if [ ! -f "artifacts/$expected_asset" ]; then
              echo "::error::Missing expected archive: $expected_asset"
              missing_count=$((missing_count + 1))
            fi
          done

          if [ $missing_count -gt 0 ]; then
            echo "::error::Release is incomplete: $missing_count of 5 platform archives missing. The release must have all 5 binaries before checksums can be generated."
            exit 1
          fi

          echo "✓ All 5 expected archives present"

      - name: Verify every component asset is present
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          [ -f artifacts/poly-components.lock.json ] || {
            echo "::error::missing poly-components.lock.json"
            exit 1
          }
          # An entry reused from an earlier release points at that release's asset. Every other
          # entry was built for this tag and must have its archive and record uploaded here.
          local_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          built=0
          total="$(jq '.artifacts | length' artifacts/poly-components.lock.json)"
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            built=$((built + 1))
            archive="${url#"$local_prefix"}"
            for asset in "$archive" "$archive.record.json"; do
              [ -f "artifacts/$asset" ] || {
                echo "::error::missing component asset: $asset"
                missing=$((missing + 1))
              }
            done
          done < <(jq -r --arg prefix "$local_prefix" '.artifacts[] | select(.url | startswith($prefix)) | .url' artifacts/poly-components.lock.json)
          [ "$total" -gt 0 ] || {
            echo "::error::the component lock has no artifacts"
            exit 1
          }
          # An entry reused from an earlier release must still be there: ask that release for its
          # asset list rather than fetching the URL.
          reused=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            reused=$((reused + 1))
            rest="${url#"https://github.com/${GITHUB_REPOSITORY}/releases/download/"}"
            old_tag="${rest%%/*}"
            asset="${rest#*/}"
            if ! gh release view "$old_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
              echo "::error::reused component asset $asset is gone from release $old_tag"
              missing=$((missing + 1))
            fi
          done < <(jq -r --arg prefix "$local_prefix" '.artifacts[] | select((.url | startswith($prefix)) | not) | .url' artifacts/poly-components.lock.json)
          [ $((built + reused)) -eq "$total" ] || {
            echo "::error::lock has $total artifacts but $built are built here and $reused reused"
            exit 1
          }
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ the lock has $total component artifacts, $built built for $RELEASE_TAG with their assets present, $((total - built)) reused"

      # Every archive built for this tag, poly's and each component's, ships its SBOM as <archive>.cdx.json.
      - name: Verify every archive has its SBOM
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          archives=(poly-*.tar.gz poly-*.zip)
          missing=0
          for archive in "${archives[@]}"; do
            if [ ! -f "$archive.cdx.json" ]; then
              echo "::error::missing SBOM $archive.cdx.json"
              missing=$((missing + 1))
            fi
          done
          sboms=(*.cdx.json)
          [ "$missing" -eq 0 ] && [ "${#sboms[@]}" -eq "${#archives[@]}" ] || {
            echo "::error::${#archives[@]} archives, ${#sboms[@]} SBOMs, $missing missing"
            exit 1
          }
          echo "✓ ${#archives[@]} archives, each with its SBOM"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          # Core and component archives, their SBOMs, component records, and the lock. Every
          # name starts with poly-, which is the pattern the registry jobs download and check.
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.record.json" -o -name "*.cdx.json" \
            -o -name "poly-components.lock.json" \) -exec sha256sum {} \; | sort > ../sha256sums.txt
          cat ../sha256sums.txt

      # One SBOM attestation per archive: actions/attest-sbom binds one SBOM to its subject per call, so
      # attest_sboms runs a matrix over these pairs, by digest, with only the SBOMs downloaded.
      - name: List the SBOM attestations
        id: sbom_pairs
        run: |
          set -euo pipefail
          pairs="$(awk '{ n = $NF; sub(/^\.\//, "", n); print $1 "\t" n }' sha256sums.txt | jq -Rsc '
            [split("\n")[] | select(length > 0) | split("\t") | {digest: ("sha256:" + .[0]), name: .[1]}]
            | (map({(.name): .digest}) | add) as $digests
            | [.[] | select(.name | endswith(".cdx.json")) | (.name | rtrimstr(".cdx.json")) as $subject
               | {sbom: .name, subject: $subject, digest: $digests[$subject]}]')"
          count="$(jq 'length' <<< "$pairs")"
          jq -e 'length > 0 and length <= 256 and all(.[]; .digest != null)' <<< "$pairs" > /dev/null || {
            echo "::error::$count SBOM pairs, or one without its archive's digest"
            exit 1
          }
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
          echo "$count SBOM attestations to make"

      - name: Save the SBOMs for attestation
        uses: actions/upload-artifact@v7
        with:
          name: release-sboms
          path: artifacts/*.cdx.json
          if-no-files-found: error

      - name: Save the checksums for the upload
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: sha256sums.txt
          if-no-files-found: error

  # Build provenance (SLSA, signed through Sigstore with this workflow's OIDC identity) for every file
  # sha256sums.txt lists, the poly and component archives and the lock among them, and for
  # sha256sums.txt itself. Subjects are named by digest, so nothing large is downloaded.
  attest_provenance:
    if: ${{ !inputs.plugins-only }}
    name: Attest build provenance
    needs: [meta, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the checksums
        uses: actions/download-artifact@v8
        with:
          name: release-checksums
          path: sums

      - name: Name the subjects without the ./ prefix
        run: |
          set -euo pipefail
          awk '{ n = $NF; sub(/^\.\//, "", n); print $1 "  " n }' sums/sha256sums.txt > subjects.sha256
          wc -l < subjects.sha256

      - name: Attest the release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: subjects.sha256

      - name: Attest sha256sums.txt
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sums/sha256sums.txt

  attest_sboms:
    if: ${{ !inputs.plugins-only }}
    name: Attest SBOM / ${{ matrix.subject }}
    needs: [meta, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.checksums.outputs.sbom_pairs) }}
    steps:
      - name: Download the SBOMs
        uses: actions/download-artifact@v8
        with:
          name: release-sboms
          path: sboms

      - name: Attest the SBOM of ${{ matrix.subject }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ matrix.subject }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sboms/${{ matrix.sbom }}

  # The only build-path job with a write token: it uploads exactly the files sha256sums.txt lists,
  # after checking each against it, and builds nothing.
  publish_assets:
    if: ${{ !inputs.plugins-only }}
    name: Upload release assets
    needs: [meta, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          pattern: releases-*
          merge-multiple: true
          path: artifacts

      - name: Download the checksums
        uses: actions/download-artifact@v8
        with:
          name: release-checksums
          path: artifacts

      - name: Check every listed file and upload it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c sha256sums.txt
          mapfile -t assets < <(awk '{ n = $NF; sub(/^\.\//, "", n); print n }' sha256sums.txt)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::sha256sums.txt lists nothing"; exit 1; }
          # Assets first, sha256sums.txt last: it is the marker meta and the installers read as "complete".
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber sha256sums.txt
          echo "uploaded ${#assets[@]} assets and sha256sums.txt to $RELEASE_TAG"

  finalize_release:
    name: Publish GitHub release
    needs: [meta, checksums, publish_assets, attest_provenance, attest_sboms]
    # A run that built anything promotes only once checksums, the upload and both attestation jobs
    # succeeded. A dispatch that found the draft already complete (release_assets_exist) builds
    # nothing, so those jobs are skipped and the asset check below decides alone.
    if: >-
      !inputs.plugins-only && always() && needs.meta.result == 'success'
      && (needs.meta.outputs.release_assets_exist == 'true'
      || (needs.checksums.result == 'success' && needs.publish_assets.result == 'success'
      && needs.attest_provenance.result == 'success' && needs.attest_sboms.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Promote draft to published release once complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"

          # The full asset set the installer needs: every platform archive plus
          # the checksums file they verify against.
          required=(
            "poly-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "poly-${version}-x86_64-unknown-linux-musl.tar.gz"
            "poly-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "poly-${version}-aarch64-apple-darwin.tar.gz"
            "poly-${version}-x86_64-pc-windows-msvc.zip"
            "poly-${version}-x86_64-unknown-linux-gnu.tar.gz.cdx.json"
            "poly-${version}-x86_64-unknown-linux-musl.tar.gz.cdx.json"
            "poly-${version}-aarch64-unknown-linux-gnu.tar.gz.cdx.json"
            "poly-${version}-aarch64-apple-darwin.tar.gz.cdx.json"
            "poly-${version}-x86_64-pc-windows-msvc.zip.cdx.json"
            "poly-components.lock.json"
            "sha256sums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          # Every component the lock points at this tag was built for it and needs its archive and
          # record here; entries reused from an earlier release point at that release instead.
          scratch="$(mktemp -d)"
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern poly-components.lock.json --dir "$scratch"; then
            prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
            total="$(jq '.artifacts | length' "$scratch/poly-components.lock.json")"
            if [ "$total" -eq 0 ]; then
              echo "::error::the release's component lock has no artifacts"
              missing=$((missing + 1))
            fi
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              archive="${url#"$prefix"}"
              for asset in "$archive" "$archive.record.json" "$archive.cdx.json"; do
                if ! grep -qx "$asset" /tmp/assets.txt; then
                  echo "::error::release $tag is missing component asset $asset"
                  missing=$((missing + 1))
                fi
              done
            done < <(jq -r --arg prefix "$prefix" '.artifacts[] | select(.url | startswith($prefix)) | .url' "$scratch/poly-components.lock.json")
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing required assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "✓ Promoted $tag to a published release"

  # Homebrew and Scoop follow the polylint organization's pattern: the formula and manifests are
  # rendered from templates in packaging/ with xberg-io/actions, and pushed to the shared
  # polylint/homebrew-tap and polylint/scoop-bucket with a token minted from the organization's
  # GitHub App (org secrets BOT_APP_ID / BOT_APP_PRIVATE_KEY), committed as polylint-release-helper[bot].
  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    # Fails hard: a tap that did not update keeps serving the previous release indefinitely, and the
    # failure has to be visible in the run that caused it.
    permissions:
      contents: read
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Check this is the newest release
        id: newest
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          # Only the newest release may move a "latest" pointer: a dispatch re-run of an older tag
          # must not roll it back.
          newest="$(git ls-remote --tags origin 'v*' | awk '{ sub("refs/tags/", "", $2); print $2 }' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ "$tag" = "$newest" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag is not the newest release tag ($newest); leaving the Homebrew formula unchanged"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.newest.outputs.newest == 'true'
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        if: steps.newest.outputs.newest == 'true'
        with:
          repository: polylint/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      # A prebuilt-binary formula: it points at the same release archives every other channel
      # serves (macOS arm64, Linux arm64 and x86_64), never a source build.
      - uses: xberg-io/actions/publish-homebrew-source-formulas@v1
        if: steps.newest.outputs.newest == 'true'
        with:
          tap-dir: ${{ github.workspace }}/homebrew-tap
          config-file: packaging/homebrew.json
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          github-repo: ${{ github.repository }}
          token: ${{ github.token }}

      - name: Check the rendered hashes against sha256sums.txt
        if: steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The render step hashes the archives it downloads. Cross-check every hash against the
          # release's own sha256sums.txt, the file every other channel verifies against, so the
          # formula can never come to disagree with the published checksums.
          gh release download "${{ needs.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern sha256sums.txt --dir sums --clobber
          awk '{ print $1 }' sums/sha256sums.txt | sort -u > sums/listed.txt
          grep -oE 'sha256 "[0-9a-f]{64}"' homebrew-tap/Formula/polylint.rb | grep -oE '[0-9a-f]{64}' | sort -u > sums/rendered.txt
          [ -s sums/rendered.txt ] || { echo "::error::no hashes found in the rendered formula" >&2; exit 1; }
          if unlisted="$(comm -23 sums/rendered.txt sums/listed.txt)" && [ -n "$unlisted" ]; then
            echo "::error::rendered hashes not in sha256sums.txt: $unlisted" >&2
            exit 1
          fi

      - name: Commit and push to the tap
        if: steps.newest.outputs.newest == 'true'
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          # The formula is polylint; `brew install polylint/tap/poly` keeps working through the
          # Aliases/poly symlink, and formula_renames.json carries machines that installed the old
          # poly formula over to polylint on `brew upgrade`.
          git rm --quiet --ignore-unmatch Formula/poly.rb
          mkdir -p Aliases
          ln -sfn ../Formula/polylint.rb Aliases/poly
          if [ -f formula_renames.json ]; then
            jq -S '. + {"poly": "polylint"}' formula_renames.json > formula_renames.json.new
          else
            printf '{"poly": "polylint"}\n' | jq -S . > formula_renames.json.new
          fi
          mv formula_renames.json.new formula_renames.json
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          git add Formula/polylint.rb Aliases/poly formula_renames.json
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "polylint ${{ needs.meta.outputs.version }}"
          # Every polylint tool's release pushes to this one shared tap, so a concurrent release can
          # land between the checkout and the push and reject it as non-fast-forward. Each repository
          # touches only its own files, so rebasing onto the new tip and retrying is safe. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  homebrew_bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    needs: [meta, publish_homebrew]
    if: >-
      !inputs.plugins-only && needs.publish_homebrew.result == 'success'
      && needs.publish_homebrew.outputs.newest == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      # Uploads the bottle tarball to this release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, bottle_tag: arm64_tahoe, install_brew: false }
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Install Homebrew (Linux)
        if: matrix.install_brew
        uses: xberg-io/actions/install-homebrew-linux@v1

      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          tap: polylint/tap
          formulas: |
            polylint
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: ${{ github.repository }}
          token: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish_homebrew_bottles:
    name: Merge Homebrew bottle DSL
    needs: [meta, publish_homebrew, homebrew_bottles]
    # Runs even when a bottle leg failed: that leg already turns the run red, and the merge then
    # fails loudly on the missing bottle JSON rather than silently publishing a partial block.
    if: >-
      !cancelled() && !inputs.plugins-only && needs.publish_homebrew.result == 'success'
      && needs.publish_homebrew.outputs.newest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          repository: polylint/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            polylint
          github-repo: ${{ github.repository }}

      - name: Commit and push bottle DSL
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/polylint.rb
          git commit -m "polylint ${{ needs.meta.outputs.version }}: add bottle DSL"
          # Every polylint tool's release pushes to this one shared tap, so a concurrent release can
          # land between the checkout and the push and reject it as non-fast-forward. Each repository
          # touches only its own files, so rebasing onto the new tip and retrying is safe. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  publish_scoop:
    name: Update Scoop bucket
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    # Non-blocking: a bucket that did not update is worth a red job, but it must not fail the
    # release run, which by this point has already published the GitHub release every other
    # channel is served from. Nothing depends on this job, so its failure cannot re-draft the
    # release.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Check this is the newest release
        id: newest
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          # Only the newest release may move a "latest" pointer: a dispatch re-run of an older tag
          # must not roll it back.
          newest="$(git ls-remote --tags origin 'v*' | awk '{ sub("refs/tags/", "", $2); print $2 }' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ "$tag" = "$newest" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag is not the newest release tag ($newest); leaving the Scoop bucket unchanged"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.newest.outputs.newest == 'true'
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: scoop-bucket

      - uses: actions/checkout@v7
        if: steps.newest.outputs.newest == 'true'
        with:
          repository: polylint/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      # polylint.json is the canonical manifest; poly.json is rendered from the same template so
      # `scoop install poly` and existing installs keep updating. Both carry the poly + polylint
      # shim pair in `bin`. Only x86_64-pc-windows-msvc is built, so there is no arm64 block.
      - uses: xberg-io/actions/publish-scoop-manifests@v1
        if: steps.newest.outputs.newest == 'true'
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: packaging/scoop.json
          tag: ${{ needs.meta.outputs.tag }}
          version: ${{ needs.meta.outputs.version }}
          github-repo: ${{ github.repository }}
          token: ${{ github.token }}

      - name: Check the rendered hashes against sha256sums.txt
        if: steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The render step hashes the archives it downloads. Cross-check every hash against the
          # release's own sha256sums.txt, the file every other channel verifies against, so the
          # manifests can never come to disagree with the published checksums.
          gh release download "${{ needs.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern sha256sums.txt --dir sums --clobber
          awk '{ print $1 }' sums/sha256sums.txt | sort -u > sums/listed.txt
          jq -r '.architecture[].hash' scoop-bucket/bucket/polylint.json scoop-bucket/bucket/poly.json | sort -u > sums/rendered.txt
          jq -e '.bin | length == 2' scoop-bucket/bucket/polylint.json scoop-bucket/bucket/poly.json >/dev/null ||
            { echo "::error::a rendered manifest lost its poly + polylint bin pair" >&2; exit 1; }
          [ -s sums/rendered.txt ] || { echo "::error::no hashes found in the rendered manifests" >&2; exit 1; }
          if unlisted="$(comm -23 sums/rendered.txt sums/listed.txt)" && [ -n "$unlisted" ]; then
            echo "::error::rendered hashes not in sha256sums.txt: $unlisted" >&2
            exit 1
          fi

      - name: Commit and push to the bucket
        if: steps.newest.outputs.newest == 'true'
        working-directory: scoop-bucket
        run: |
          set -euo pipefail
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          git add bucket/polylint.json bucket/poly.json
          if git diff --cached --quiet; then
            echo "Manifests already up to date."
            exit 0
          fi
          git commit -m "polylint ${{ needs.meta.outputs.version }}"
          # Every polylint tool's release pushes to this one shared bucket, so a concurrent release can
          # land between the checkout and the push and reject it as non-fast-forward. Each repository
          # touches only its own files, so rebasing onto the new tip and retrying is safe. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1

  verify_binstall:
    name: Verify cargo binstall resolves the release
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    # Non-blocking like the registry jobs: the release is already public, and a
    # resolution failure means binstall users fall through to an error, which a
    # red job here reports without re-drafting anything.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1

      # Checks the tagged crate's own metadata against the published archives, so
      # a pkg-url that no longer matches the asset names fails on the release
      # that introduced it.
      - name: Resolve every shipped triple
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run verify:binstall crates/poly-cli

  publish_npm:
    name: Publish npm (@polylint/polylint)
    needs: [meta, finalize_release]
    # Registry payloads must match the finalized release binaries before any skip or upload. ~keep
    if: >-
      !inputs.plugins-only && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm trusted publishing exchanges for a publish
      # credential. No NODE_AUTH_TOKEN is set anywhere in this job.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - &registry-controller
        name: Load immutable controller publication guard
        env:
          CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --no-write-fetch-head origin "$CONTROLLER_SHA"
          controller="$(mktemp -d "$RUNNER_TEMP/poly-registry-controller.XXXXXX")"
          # The guard must come from the workflow's own commit, not from the ref under release, so it
          # is extracted rather than run through `mise run` against the checked-out tree. These are
          # the files of the verify:registry-payload task.
          for helper in registry-payload.py registry_archive.py; do
            git show "$CONTROLLER_SHA:mise-tasks/verify/$helper" > "$controller/$helper"
            test -s "$controller/$helper"
          done
          echo "POLY_REGISTRY_GUARD=$controller/registry-payload.py" >> "$GITHUB_ENV"

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Download the published release archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          # Fetch what is attached to the release rather than rebuilding, so the
          # binaries inside the pnpm packages are byte-identical to the archives
          # sha256sums.txt describes. A separate build would drift silently.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'poly-*' --pattern 'sha256sums.txt' --dir artifacts --clobber
          ls -l artifacts

      - name: Verify the archives against the release checksums
        run: |
          set -euo pipefail
          cd artifacts
          # sha256sums.txt was generated from `find .`, so its paths carry a ./
          # prefix that `sha256sum -c` resolves relative to this directory.
          sha256sum -c sha256sums.txt
          echo "✓ every downloaded archive matches the release checksums"

      - name: Stage the release binaries into the platform packages
        run: ./npm-package/stage-binaries.sh --artifacts artifacts

      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          # A real release claims `latest`. The 0.0.0 bootstrap publish sits under
          # a `placeholder` dist-tag precisely so it never becomes what
          # `pnpm add @polylint/polylint` resolves to; nothing here should
          # carry that tag forward.
          case "$version" in
            *-rc.* | *-beta* | *-alpha*) npm_tag="next" ;;
            *) npm_tag="latest" ;;
          esac
          # Only the newest release tag may move `latest`: a hotfix of an older line gets a
          # per-line dist-tag instead of rolling `latest` backwards.
          if [ "$npm_tag" = "latest" ]; then
            tag="${{ needs.meta.outputs.tag }}"
            newest="$(git ls-remote --tags origin 'v*' | awk '{ sub("refs/tags/", "", $2); print $2 }' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
            if [ "$tag" != "$newest" ]; then
              npm_tag="release-$(cut -d. -f1,2 <<< "$version")"
              echo "::notice::$tag is not the newest release tag ($newest); publishing under --tag $npm_tag"
            fi
          fi

          publish_one() {
            local dir="$1"
            local name
            name="$(jq -r '.name' "$dir/package.json")"
            local pack_dir archive verdict
            pack_dir="$(mktemp -d)"
            ( cd "$dir" && pnpm pack --json --pack-destination "$pack_dir" ) > "$pack_dir/pack.json"
            archive="$(jq -r '.filename' "$pack_dir/pack.json")"
            case "$archive" in /*) ;; *) archive="$pack_dir/$archive" ;; esac
            verdict="$(python3 "$POLY_REGISTRY_GUARD" npm "$archive")"
            if [ "$verdict" = "exists=true" ]; then
              echo "· ${name}@${version} has the identical payload; skipping"
              return 0
            fi
            [ "$verdict" = "exists=false" ] || { echo "Invalid parity verdict" >&2; exit 1; }
            echo "→ publishing ${name}@${version} (--tag ${npm_tag})"
            # --provenance attaches a signed build-provenance attestation using
            # the job's id-token.
            ( cd "$dir" && pnpm publish "$archive" --no-git-checks --provenance --access public --tag "$npm_tag" )
          }

          # Platform packages first, and `set -e` means a failed one aborts the
          # step before the umbrella is published. That ordering is what keeps a
          # partial failure from producing the worst outcome: an umbrella package
          # on `latest` whose pinned binaries do not exist, which installs
          # cleanly and then has no `poly` to run.
          platforms=(npm-package/platforms/*/)
          expected="$(jq -er '.optionalDependencies | length | select(. > 0)' npm-package/package.json)"
          [ "${#platforms[@]}" -eq "$expected" ] || { echo "Incomplete npm platform inventory" >&2; exit 1; }
          for dir in "${platforms[@]}"; do
            publish_one "${dir%/}"
          done
          publish_one npm-package

  publish_plugin_npm:
    name: Publish npm agent plugin (OpenCode and Pi)
    needs: [plugin-meta, meta, finalize_release]
    if: >-
      always() && ((inputs.plugins-only && needs.plugin-meta.result == 'success')
      || (!inputs.plugins-only && needs.finalize_release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugins-only && github.sha || needs.meta.outputs.tag }}

      - *registry-controller

      - name: Install reviewed ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Verify generated product bundles and public skills
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          ai-rulez verify --plugin
          mise run plugin:sync-skills --check
          mise run plugin:sync-version --check

      - name: Verify packed Pi and OpenCode resources
        run: |
          set -euo pipefail
          pnpm --dir plugin pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/plugin-pack.json"
          node - "$RUNNER_TEMP/plugin-pack.json" <<'JS'
          const fs = require('node:fs');
          const files = JSON.parse(fs.readFileSync(process.argv[2])).files.map((file) => file.path);
          const skills = files.filter((file) => /^\.pi\/skills\/[^/]+\/SKILL\.md$/.test(file));
          const prompts = files.filter((file) => /^\.pi\/prompts\/[^/]+\.md$/.test(file));
          if (skills.length !== 5 || prompts.length !== 2 || !files.includes('.opencode/plugins/poly.js')) {
            throw new Error(`Incomplete plugin: ${skills.length} skills, ${prompts.length} prompts`);
          }
          console.log(`Packed ${skills.length} Pi skills, ${prompts.length} prompts, and the OpenCode adapter`);
          JS

      - name: Verify exact packaged Pi and OpenCode resource bytes
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          archive="$(jq -r '.filename' "$RUNNER_TEMP/plugin-pack.json")"
          case "$archive" in /*) ;; *) archive="$RUNNER_TEMP/$archive" ;; esac
          mise run verify:plugin-distribution npm "$archive"

      - name: Check the exact npm plugin payload
        id: npm-version
        run: |
          archive="$(jq -r '.filename' "$RUNNER_TEMP/plugin-pack.json")"
          case "$archive" in /*) ;; *) archive="$RUNNER_TEMP/$archive" ;; esac
          python3 "$POLY_REGISTRY_GUARD" npm "$archive" >> "$GITHUB_OUTPUT"
      - name: Resolve the npm dist-tag
        id: npm-tag
        if: steps.npm-version.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
          RELEASE_TAG: ${{ inputs.plugins-only && '' || needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            npm_tag="next"
          else
            npm_tag="latest"
            # Only the newest release tag may move `latest`; plugins-only publishes current main.
            if [ -n "$RELEASE_TAG" ]; then
              newest="$(git ls-remote --tags origin 'v*' | awk '{ sub("refs/tags/", "", $2); print $2 }' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
              if [ "$RELEASE_TAG" != "$newest" ]; then
                npm_tag="release-$(cut -d. -f1,2 <<< "$VERSION")"
                echo "::notice::$RELEASE_TAG is not the newest release tag ($newest); using --tag $npm_tag"
              fi
            fi
          fi
          echo "tag=$npm_tag" >> "$GITHUB_OUTPUT"
      - name: Publish verified agent package
        if: steps.npm-version.outputs.exists != 'true'
        uses: xberg-io/actions/publish-npm@v1
        with:
          expected-version: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
          package-dir: plugin
          access: public
          npm-tag: ${{ steps.npm-tag.outputs.tag }}
          provenance: "true"

  publish_plugin_artifacts:
    name: Publish all agent runtime archives and marketplaces
    needs: [meta, finalize_release]
    # Keyed on meta, not on finalize_release: a dispatch that re-runs an already
    # finalized release leaves finalize_release skipped, which used to skip the archives
    # job and make the verifier reject an otherwise complete release. Uploads are
    # idempotent, so running it again is safe.
    if: >-
      always() && !inputs.plugins-only && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: python
      - name: Verify public skill exports
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run plugin:sync-skills --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@v1
        with:
          cursor-marketplace: "true"
          tag: ${{ needs.meta.outputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: mise-tasks/plugin/sync-version.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ needs.meta.outputs.tag }}
          PLUGIN_PRODUCT: poly
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256

  publish_plugin_hermes:
    name: Publish Hermes plugin to PyPI
    needs: [plugin-meta, meta, finalize_release]
    if: >-
      always() && ((inputs.plugins-only && needs.plugin-meta.result == 'success')
      || (!inputs.plugins-only && needs.finalize_release.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugins-only && github.sha || needs.meta.outputs.tag }}
          fetch-depth: 0
      - *registry-controller

      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Setup Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: python uv
      - name: Verify plugin versions and generated resources before publishing
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          VERSION: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mise run plugin:sync-version --expect "$VERSION"
          mise run plugin:sync-skills --check
          ai-rulez verify --plugin
      - name: Read the verified Hermes package version
        id: wheel-version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if project['name'] != 'poly-hermes-plugin' or not project['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={project['version']}\n")
          PY
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Verify every packaged Hermes runtime resource
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run verify:plugin-distribution wheel dist-hermes/*.whl
      - name: Verify immutable Hermes registry payloads
        run: python3 "$POLY_REGISTRY_GUARD" wheel --expected-count 1 dist-hermes/*.whl
      - name: Publish verified Hermes wheel
        uses: xberg-io/actions/publish-pypi@v1
        with:
          expected-version: ${{ steps.wheel-version.outputs.version }}
          packages-dir: dist-hermes

  publish_pypi:
    name: Publish PyPI (polylint)
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for this project names this environment; the two
    # must agree or the OIDC exchange is refused.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - *registry-controller

      - name: Setup Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: python

      - name: Download the published release archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'poly-*' --pattern 'sha256sums.txt' --dir artifacts --clobber
          ls -l artifacts

      - name: Verify the archives against the release checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c sha256sums.txt
          echo "✓ every downloaded archive matches the release checksums"

      - name: Build the platform wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build hatchling
          python pip-package/build_wheels.py --artifacts artifacts --out pip-package/dist
          ls -l pip-package/dist

      - name: Verify immutable native PyPI registry payloads
        run: python3 "$POLY_REGISTRY_GUARD" wheel --expected-count 6 pip-package/dist/*.whl

      - name: Publish to PyPI
        # Trusted publishing (OIDC) — no API token. skip-existing keeps a re-run
        # of a partially uploaded release from failing on the files that landed.
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  update_major_tag:
    name: Move the major version tag
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # GITHUB_TOKEN cannot move a ref across commits that change .github/workflows (it lacks the
      # `workflows` permission), so the push uses a token minted from the organization's GitHub App
      # with contents and workflows write. If the App cannot grant that, the job falls back to
      # GITHUB_TOKEN, which still moves the tag whenever the release left .github/workflows alone.
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: polylint
          repositories: polylint
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Move major tag to this release
        env:
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          major="v${version%%.*}"
          sha="$(git rev-list -n1 "$tag")"
          # Only the newest release may move a "latest" pointer: a dispatch re-run of an older tag
          # must not roll it back.
          newest="$(git ls-remote --tags origin 'v*' | awk '{ sub("refs/tags/", "", $2); print $2 }' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ "$tag" != "$newest" ]; then
            echo "::notice::$tag is not the newest release tag ($newest); leaving the major tag unchanged"
            exit 0
          fi
          git config user.name "polylint-release-helper[bot]"
          git config user.email "357288453+polylint-release-helper[bot]@users.noreply.github.com"
          git tag -f "$major" "$sha"
          if ! git push -f origin "refs/tags/${major}"; then
            if [ "$HAS_APP_TOKEN" != "true" ]; then
              echo "::error::Moving ${major} needs contents and workflows write access when the release changes .github/workflows. The organization GitHub App (BOT_APP_ID / BOT_APP_PRIVATE_KEY) could not mint a token with them; grant the App the Workflows permission on polylint/polylint."
            fi
            exit 1
          fi
          echo "Moved ${major} → ${tag} (${sha})"

  plugin_release_report:
    name: Verify requested plugin distribution jobs succeeded
    needs: [publish_plugin_artifacts, publish_plugin_npm, publish_plugin_hermes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete plugin distribution
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          PLUGINS_ONLY: ${{ inputs.plugins-only }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS_JSON'])
          expected = {'publish_plugin_artifacts', 'publish_plugin_npm', 'publish_plugin_hermes'}
          if set(results) != expected:
              raise SystemExit('Expected exactly three plugin distribution jobs')
          for name, job in results.items():
              wanted = 'skipped' if name == 'publish_plugin_artifacts' and os.environ['PLUGINS_ONLY'] == 'true' else 'success'
              if job['result'] != wanted:
                  raise SystemExit(f"Incomplete plugin distribution: {name}={job['result']}, expected {wanted}")
          print('Verified all three requested plugin job outcomes')
          PY
