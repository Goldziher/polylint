[package]
name = "poly-engines-tsrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
publish = false
description = "The tsrs engine family for poly (TypeScript type checking) and its component."

[lib]
name = "poly_engines_tsrs"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
poly-component-protocol.workspace = true
poly-engine-api.workspace = true
poly-engines.workspace = true
serde_json.workspace = true
toml.workspace = true
polylint-tsrs.workspace = true
tracing.workspace = true
tsrs_ast.workspace = true
tsrs_compiler.workspace = true
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_tsoptions.workspace = true

[dev-dependencies]
poly-component-host.workspace = true
poly-component-index.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# Freeing a tsrs program, the one unsafe call of the check, is `polylint-tsrs`'s (ADR 0078).
[lints.rust]
unsafe_code = "forbid"
