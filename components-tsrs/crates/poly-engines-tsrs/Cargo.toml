[package]
name = "poly-engines-tsrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
publish = false
description = "The tsrs engine family for poly (TypeScript type checking) and its component."

[lib]
name = "poly_engines_tsrs"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
poly-engine-api.workspace = true
poly-engines.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tsrs_ast.workspace = true
tsrs_compiler.workspace = true
tsrs_core.workspace = true
tsrs_diagnostics.workspace = true
tsrs_tsoptions.workspace = true
tsrs_vfs.workspace = true

[dev-dependencies]
poly-component-host.workspace = true
poly-component-index.workspace = true
poly-component-protocol.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# `deny`, not `forbid`: freeing a tsrs program is the one unsafe call (`src/owner.rs`), allowed where it is made.
[lints.rust]
unsafe_code = "deny"
