[licenses]
version = 2
# The engine crates are never published (`polylint-tsrs` is, and is MIT, ADR 0078); the alef-generated component
# producer crate carries no license field.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "BSL-1.0",
  "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
