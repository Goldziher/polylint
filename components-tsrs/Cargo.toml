# The TypeScript type-checking engine family, in a cargo workspace of its own. tsrs pins `icu_normalizer` to an exact
# version, which cannot unify with the newer ICU crates the SQL engine's dependencies need in `components/`, so the
# two cannot share a lockfile (ADR 0051). alef builds the component from here (`source_manifest` / `producer_dir` in
# the root alef.toml).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.35.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
repository = "https://github.com/Goldziher/polylint"
documentation = "https://github.com/Goldziher/polylint"

[workspace.dependencies]
anyhow = "1"
poly-component-host = { path = "../crates/poly-component-host" }
poly-component-index = { path = "../crates/poly-component-index" }
poly-component-protocol = { path = "../crates/poly-component-protocol" }
poly-engine-api = { path = "../crates/poly-engine-api" }
poly-engines = { path = "../crates/poly-engines", default-features = false }
poly-engines-tsrs = { path = "crates/poly-engines-tsrs" }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml = "1"
tracing = "0.1"
# tsrs, the Rust port of the TypeScript 7 compiler: an exact pin on every crate, like the other unsemvered
# internals (ADR 0051). `plain-ptrs` avoids the fixed 32 GiB address-space reservation of its compressed pointers.
tsrs_ast = { version = "=7.1.0-beta.tsrs1", default-features = false }
tsrs_compiler = { version = "=7.1.0-beta.tsrs1", default-features = false }
tsrs_core = { version = "=7.1.0-beta.tsrs1", default-features = false, features = ["plain-ptrs"] }
tsrs_diagnostics = { version = "=7.1.0-beta.tsrs1", default-features = false }
tsrs_tsoptions = { version = "=7.1.0-beta.tsrs1", default-features = false }
tsrs_vfs = { version = "=7.1.0-beta.tsrs1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
