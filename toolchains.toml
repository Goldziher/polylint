baseline = "v1.18.0"

# The component crates alef-component-abi/runtime are pinned at =0.129.4 in Cargo.toml, and the CLI
# that builds and locks components must match that ABI; the baseline still carries 0.116.0.
[overrides."github:xberg-io/alef"]
version = "0.129.4"
reason = "must match the alef-component-abi/runtime =0.129.4 crates the component ABI is built on"
